name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_catalog.py
      - run: python tools/build_hako_agent.py dist/hako-agent-1.0.1.mcpack
      - run: python -m zipfile --test dist/hako-agent-1.0.1.mcpack
